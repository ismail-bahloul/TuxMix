# RME Babyface Pro FS (kernel driver) — PipeWire node tuning.
#
# TIMING (measured 2026-10-21: 60 s of silent full-duplex per point,
# 12 ch @ 48 kHz, xruns from pw-top ERR, period from hw_params):
#  - Polled/IRQ scheduling (api.alsa.disable-tsched = true, kept
#    explicitly) with no pinned ALSA period: the card follows the graph
#    quantum (256 -> 256, 64 -> 64, 32 -> 32 frames, 3 periods, buffer =
#    3 x quantum), 0 xrun at all three sizes.  With no quantum forced the
#    graph default is 64, so the card runs 64 (1.33 ms); pick 256 in
#    TuxMix for TotalMix parity (5.33 ms).
#  - Timer-based scheduling (api.alsa.disable-tsched = false) is
#    unreliable, not reproducibly broken: period 1024 / buffer 16384
#    whatever the quantum, with stop/start loops that can start after
#    tens of seconds (one run: 749-1492 xruns in 8 s at 256/64/32;
#    another: clean 60 s at 256, then 16k xruns at 64).  A 60 s clean
#    run proves nothing here: do NOT remove disable-tsched.
#  - This PipeWire build already defaults disable-tsched to true, so a
#    rule with no timing props behaves the same today; keeping the prop
#    explicit protects against that default changing.
#
# Do not pin api.alsa.period-size / api.alsa.period-num here: lowering
# the buffer in PipeWire (TuxMix's buffer picker) must reach the card.
#
# Low-latency DAW profile (10-min soaks, 2026-10-21): periods 24 and 16
# ran with the module loaded as urb_frames_min=8 nurbs=16 (0.33 ms @
# 48 kHz; 0 and 1 capture xrun respectively).  8 frames still loses
# capture buffers.  The ALSA period is floored by urb_frames_min (32 by
# default), NOT by frames_per_urb, so a period < 32 needs the module
# param too — see tools/kernel/snd-usb-babyface-pro.c.
#
# node.description/nick fix the UI name: the USB product string is
# "Babyface Pro (73055480)", which would otherwise leak "Babyface Pro" /
# "Babyface Pro Stereo" into the PipeWire nodes.
#
# SYSTEM VOLUME = SOFTWARE (2026-08-26, cap_sysvol2.pcap): the Windows
# "Speakers" volume is a HOST-SIDE stream gain — zero USB writes, the
# mixer stays untouched.  On Linux the kernel driver's output-master
# controls are named per output ("AN1/2 Playback Volume" etc.) so SPA's
# default "Master" element search finds nothing and the sink falls back
# to software volume — wpctl set-volume no longer moves any hardware
# register (verified 2026-08-26: AN1/2 register unchanged across
# wpctl 0.5/0.9).  The output masters stay plain mixer controls.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.usb-RME*" }
    ]
    actions = {
      update-props = {
        api.alsa.disable-tsched = true
        node.description = "Babyface Pro FS"
        node.nick = "Babyface Pro FS"
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_input.usb-RME*" }
    ]
    actions = {
      update-props = {
        api.alsa.disable-tsched = true
        node.description = "Babyface Pro FS"
        node.nick = "Babyface Pro FS"
      }
    }
  }
]
