# RME Babyface Pro FS (kernel driver) — PipeWire sink tuning.
# The device streams via interrupt URBs; timer-based scheduling (tsched)
# mis-estimates the position between URB completions and the sink fell
# into a stop/start xrun loop (audible periodic crackle).  Use polled
# scheduling (disable-tsched) so the ALSA period is honored exactly.
#
# period-size 256 = the everyday profile: TotalMix parity (256 samples =
# 5.33 ms @ 48 kHz), light on CPU, matches the module defaults
# (frames_per_urb=256 nurbs=8).
#
# Low-latency DAW profile (validated 2026-08-25): period-size 16 with the
# module loaded as frames_per_urb=16 nurbs=16 → 0.33 ms @ 48 kHz,
# 100 % stable full-duplex.  Below 16 (8 frames) the host/USB polling
# limit makes it ~90 % — see tools/kernel/snd-usb-babyface-pro.c.
# NOTE: the ALSA period is floored at frames_per_urb, so a period < 256
# requires the module param too.
#
# node.description/nick fix the UI name: the USB product string is
# "Babyface Pro (73055480)", which would otherwise leak "Babyface Pro" /
# "Babyface Pro Stereo" into the PipeWire nodes.
#
# SYSTEM VOLUME = SOFTWARE (2026-08-26, cap_sysvol2.pcap): the Windows
# "Speakers" volume is a HOST-SIDE stream gain — zero USB writes, the
# mixer stays untouched.  On Linux the kernel driver's output-master
# controls are named per output ("AN1/2 Playback Volume" etc.) so SPA's
# default "Master" element search finds nothing and the sink falls back
# to software volume — wpctl set-volume no longer moves any hardware
# register (verified 2026-08-26: AN1/2 register unchanged across
# wpctl 0.5/0.9).  The output masters stay plain mixer controls.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.usb-RME*" }
    ]
    actions = {
      update-props = {
        api.alsa.disable-tsched = true
        api.alsa.period-size = 256
        api.alsa.period-num = 2
        node.description = "Babyface Pro FS"
        node.nick = "Babyface Pro FS"
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_input.usb-RME*" }
    ]
    actions = {
      update-props = {
        api.alsa.disable-tsched = true
        api.alsa.period-size = 256
        api.alsa.period-num = 2
        node.description = "Babyface Pro FS"
        node.nick = "Babyface Pro FS"
      }
    }
  }
]
