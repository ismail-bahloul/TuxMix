# TuxMix — the RME Babyface Pro FS in proprietary mode (TotalMix
# protocol). The mixer is driven by the TuxMix GUI/TUI; this PCM
# definition only carries audio to/from the device:
#
#   aplay  -D tuxmix <file.wav>
#   arecord -D tuxmix -f S24_LE -r 48000 -c 4 <file.wav>
#
# To make it the system default (after installing the plugin):
#   pcm.!default tuxmix   (or use PipeWire with a tuxmix virtual device)

pcm.tuxmix {
    type tuxmix
}
