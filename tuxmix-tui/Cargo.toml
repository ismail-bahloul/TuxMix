[package]
name = "tuxmix-tui"
version = "0.1.0"
edition = "2021"
description = "TUI for TuxMix — control your RME interface from the terminal"

[dependencies]
tuxmix-core = { path = "../tuxmix-core", default-features = false, features = ["usb"] }
ratatui = "0.29"
crossterm = "0.28"
log = "0.4"
env_logger = "0.11"

[features]
default = ["alsa"]
# ALSA class-compliant backend (Linux only) — pass-through to tuxmix-core.
alsa = ["tuxmix-core/alsa"]
