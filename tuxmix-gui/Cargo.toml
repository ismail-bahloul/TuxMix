[package]
name = "tuxmix-gui"
version = "0.3.4"
edition = "2021"
description = "GUI for TuxMix — direct control of RME hardware DSP mixers on Linux"
license = "MIT"

[features]
default = ["alsa"]
# ALSA class-compliant backend (Linux only) — pass-through to tuxmix-core.
alsa = ["tuxmix-core/alsa"]

[dependencies]
tuxmix-core = { path = "../tuxmix-core", default-features = false, features = ["usb"] }
iced = { version = "0.14", features = ["canvas", "tokio", "advanced", "image-without-codecs"] }
log = "0.4"
env_logger = "0.11"
rosc = "0.11"
tokio = { version = "1", features = ["net", "sync", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
ksni = { version = "0.3.7", features = ["blocking"] }

# Release packages, built by tools/release/package.sh (see release.yml).
# The binaries link tuxmix-usb (GPL-3.0-or-later) and tuxmix-sys (GPL-3.0),
# so the packages are GPL-3.0 as a whole, like the AUR one.
[package.metadata.deb]
name = "tuxmix"
maintainer = "Ismaïl Bahloul <i.bahloul01@gmail.com>"
copyright = "2026, Ismaïl Bahloul"
license-file = ["../LICENSE", "0"]
extended-description = "Open-source TotalMix replacement for RME audio interfaces on Linux."
section = "sound"
depends = "$auto"
assets = [
    ["target/release/tuxmix-gui", "usr/bin/tuxmix", "755"],
    ["target/release/tuxmix-tui", "usr/bin/tuxmix-tui", "755"],
    ["assets/tuxmix.desktop", "usr/share/applications/", "644"],
    ["assets/tuxmix.svg", "usr/share/icons/hicolor/scalable/apps/tuxmix.svg", "644"],
    ["assets/tuxmix-128.png", "usr/share/icons/hicolor/128x128/apps/tuxmix.png", "644"],
    ["assets/tuxmix-256.png", "usr/share/icons/hicolor/256x256/apps/tuxmix.png", "644"],
    ["../tools/udev/70-tuxmix.rules", "usr/lib/udev/rules.d/", "644"],
    ["../README.md", "usr/share/doc/tuxmix/README.md", "644"],
]

[package.metadata.generate-rpm]
name = "tuxmix"
license = "GPL-3.0-only"
summary = "Open-source TotalMix replacement for RME audio interfaces"
assets = [
    { source = "target/release/tuxmix-gui", dest = "/usr/bin/tuxmix", mode = "755" },
    { source = "target/release/tuxmix-tui", dest = "/usr/bin/tuxmix-tui", mode = "755" },
    { source = "assets/tuxmix.desktop", dest = "/usr/share/applications/tuxmix.desktop", mode = "644" },
    { source = "assets/tuxmix.svg", dest = "/usr/share/icons/hicolor/scalable/apps/tuxmix.svg", mode = "644" },
    { source = "assets/tuxmix-128.png", dest = "/usr/share/icons/hicolor/128x128/apps/tuxmix.png", mode = "644" },
    { source = "assets/tuxmix-256.png", dest = "/usr/share/icons/hicolor/256x256/apps/tuxmix.png", mode = "644" },
    { source = "../tools/udev/70-tuxmix.rules", dest = "/usr/lib/udev/rules.d/70-tuxmix.rules", mode = "644" },
    { source = "../README.md", dest = "/usr/share/doc/tuxmix/README.md", mode = "644", doc = true },
]
auto-req = "auto"
